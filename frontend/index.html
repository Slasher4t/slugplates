<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- icon.svg carries its own baked-in squircle clip (Apple's ~22.37%
         corner-radius convention), so this one asset is already correctly
         rounded wherever it's used - here as the tab favicon, and again as
         the in-app mark in AppShell. apple-touch-icon.png is a 180x180
         raster of the same source, for iOS "Add to Home Screen"/pinned tabs
         that expect a PNG rather than SVG. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F0ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D0E" media="(prefers-color-scheme: dark)" />
    <title>SlugEats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
